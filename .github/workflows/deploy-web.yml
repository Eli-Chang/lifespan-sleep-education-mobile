name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub project pages serve the site under /<repo-name>/, so the web build needs that base path.
      # Only the build copy of app.json changes; the repo's app.json stays as it is.
      - name: Set web base path for GitHub Pages
        run: node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.experiments={...j.expo.experiments,baseUrl:'/lifespan-sleep-education-mobile'};fs.writeFileSync(p,JSON.stringify(j,null,2));"
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
      # The internal curriculum review page is not part of the public site.
      - name: Remove internal review page and prepare Pages files
        run: |
          rm -rf dist/qa
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
